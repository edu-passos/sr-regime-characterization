[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symbolic-structural-profiling"
version = "0.1.0"
description = "Model-agnostic structural profiling for labeled time-series regimes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Eduardo Passos" },
  { name = "Ricardo Inácio" },
  { name = "Moisés Santos" },
  { name = "Carlos Soares" },
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "matplotlib>=3.7",
  "pysr>=1.5.9"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
data = ["mne>=1.7"]
# Classical time-series baselines used by the comparison scripts.
baselines = ["nolds>=0.6", "antropy>=0.1"]

[project.scripts]
ssp = "symbolic_structural_profiling.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"
