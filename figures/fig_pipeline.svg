<svg viewBox="0 0 220 52" xmlns="http://www.w3.org/2000/svg" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1.5 L10,5 L0,8.5 z" fill="#444"></path>
    </marker>
    <marker id="arrStruct" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1.5 L10,5 L0,8.5 z" fill="#4F90C0"></path>
    </marker>
    <marker id="arrBehav" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1.5 L10,5 L0,8.5 z" fill="#D88A55"></path>
    </marker>
    <marker id="arrCalib" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1.5 L10,5 L0,8.5 z" fill="#8E7CA8"></path>
    </marker>
    <marker id="arrGrey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,1.5 L10,5 L0,8.5 z" fill="#9a9a9a"></path>
    </marker>

    <style>
      .band-title{ font-size: 3.8px; font-weight:600; letter-spacing:.5px; text-transform:uppercase; }
      .band-title-signal { fill:#5a6b78; }
      .band-title-symbol { fill:#8a7a55; }
      .band-title-concept{ fill:#a5765a; }

      .lbl       { font-size: 4.2px; fill:#1a1a1a; font-weight:500; }
      .lbl-cal   { font-size: 3.6px; fill:#1a1a1a; font-weight:500; }
      .lbl-sm    { font-size: 3.4px; fill:#3a3a3a; font-weight:400; }
      .annot     { font-size: 3.2px; fill:#3a3a3a; font-weight:400; }
      .vec-lbl   { font-size: 4.6px; fill:#1a1a1a; font-weight:500; }
      .arrow     { stroke:#444; stroke-width:.4; fill:none; }
      .arrow-grey{ stroke:#9a9a9a; stroke-width:.38; fill:none; stroke-dasharray:1.4,.9; }
      .arrow-struct { stroke:#4F90C0; stroke-width:.48; fill:none; }
      .arrow-behav  { stroke:#D88A55; stroke-width:.48; fill:none; }
      .arrow-calib  { stroke:#8E7CA8; stroke-width:.48; fill:none; }

      .box-up    { fill:#FFFFFF; stroke:#7a7a7a; stroke-width:.4; }
      .box-sym   { fill:#FFFFFF; stroke:#5a5a5a; stroke-width:.5; }
      .box-struct{ fill:#E2ECF4; stroke:#4F90C0; stroke-width:.48; }
      .box-behav { fill:#F6E2D1;  stroke:#D88A55;  stroke-width:.48; }
      .box-calib { fill:#ECE6F1;  stroke:#8E7CA8;  stroke-width:.48; }
    </style>
  </defs>

  <!-- background zones — flush to viewBox edges -->
  <rect x="0" y="0" width="70" height="52" fill="#ECF1F5"></rect>
  <rect x="70" y="0" width="95" height="52" fill="#FBF5E6"></rect>
  <rect x="165" y="0" width="55" height="52" fill="#FBEBDC"></rect>

  <!-- band titles -->
  <text class="band-title band-title-signal" x="35" y="4.5" text-anchor="middle">base level</text>
  <text class="band-title band-title-symbol" x="117.5" y="4.5" text-anchor="middle">symbolic level</text>
  <text class="band-title band-title-concept" x="192.5" y="4.5" text-anchor="middle">concept level</text>
  <line x1="6" y1="6.2" x2="64" y2="6.2" stroke="#b6bdc4" stroke-width=".22"></line>
  <line x1="76" y1="6.2" x2="159" y2="6.2" stroke="#c9bf9c" stroke-width=".22"></line>
  <line x1="171" y1="6.2" x2="214" y2="6.2" stroke="#d8b598" stroke-width=".22"></line>

  <!-- ============================================================
       SIGNAL SPACE — three upstream blocks (h=18, y=27–45, centre y=36).
       extraction → windowing → time-delay embedding
       ============================================================ -->

  <!-- 1. extraction: multivariate raw → single trace -->
  <g transform="translate(1,16)">
    <text class="lbl-sm" x="10" y="-2" text-anchor="middle">time series</text>
    <rect class="box-up" x="0" y="0" width="20" height="18" rx="1.2"></rect>
    <g transform="translate(2.5,3)">
      <path d="M0,1.5 L1.6,0.8 L3.2,1.4 L4.8,0.6 L6.4,1.2 L8,0.7 L9.6,1.3 L11.2,0.9 L12.8,0.4 L14.4,1.1 L15,0.8" fill="none" stroke="#9aa6b2" stroke-width=".4" stroke-linejoin="round"></path>
      <path d="M0,4.8 L1.6,5.4 L3.2,4.2 L4.8,4.9 L6.4,5.6 L8,4.7 L9.6,5.2 L11.2,4.4 L12.8,5.1 L14.4,4.6 L15,5.3" fill="none" stroke="#b0bcc6" stroke-width=".4" stroke-linejoin="round"></path>
      <path d="M0,8.0 L1.6,7.3 L3.2,8.4 L4.8,7.6 L6.4,7.1 L8,8.2 L9.6,7.5 L11.2,8.1 L12.8,7.4 L14.4,7.9 L15,7.2" fill="none" stroke="#c4ced6" stroke-width=".4" stroke-linejoin="round"></path>
      <path d="M7.5,9.2 L7.5,10.8" stroke="#7a7a7a" stroke-width=".3" marker-end="url(#arrGrey)"></path>
      <path d="M0,12.4 L2,11.4 L4,12.0 L6,10.8 L8,11.9 L10,11.0 L12,11.6 L14,10.7 L15,11.2" fill="none" stroke="#4F90C0" stroke-width=".55" stroke-linecap="round" stroke-linejoin="round"></path>
    </g>
  </g>

  <!-- 2. windowing: trace with window markers -->
  <g transform="translate(25,16)">
    <text class="lbl-sm" x="10" y="-2" text-anchor="middle">windowing</text>
    <rect class="box-up" x="0" y="0" width="20" height="18" rx="1.2"></rect>
    <g transform="translate(2.5,3.5)">
      <line x1="0" y1="10" x2="15" y2="10" stroke="#bcbcbc" stroke-width=".18"></line>
      <path d="M0,7 L1.5,5.4 L3,3.8 L4.5,4.6 L6,6.4 L7.5,7.8 L9,6.6 L10.5,4.4 L12,2.9 L13.5,4.0 L15,5.5" fill="none" stroke="#4F90C0" stroke-width=".55" stroke-linejoin="round" stroke-linecap="round"></path>
      <line x1="4" y1="0" x2="4" y2="11" stroke="#3a3a3a" stroke-width=".35" stroke-dasharray=".8,.5"></line>
      <line x1="11" y1="0" x2="11" y2="11" stroke="#3a3a3a" stroke-width=".35" stroke-dasharray=".8,.5"></line>
      <rect x="4" y="0" width="7" height="11" fill="#4F90C0" fill-opacity=".10"></rect>
    </g>
  </g>

  <!-- 3. time-delay embedding -->
  <g transform="translate(49,16)">
    <text class="lbl-sm" x="10" y="-4.5" text-anchor="middle">time delay</text>
    <text class="lbl-sm" x="10" y="-1" text-anchor="middle">embedding</text>
    <rect class="box-up" x="0" y="0" width="20" height="18" rx="1.2"></rect>
    <g transform="translate(2.5,3.5)">
      <rect x="0" y="0" width="15" height="2.5" fill="#C9D5DF" stroke="#7a7a7a" stroke-width=".15"></rect>
      <rect x="0" y="2.8" width="15" height="2.5" fill="#D7DEE5" stroke="#7a7a7a" stroke-width=".15"></rect>
      <rect x="0" y="5.6" width="15" height="2.5" fill="#E2E6EB" stroke="#7a7a7a" stroke-width=".15"></rect>
      <rect x="0" y="8.4" width="15" height="2.5" fill="#EDEFF2" stroke="#7a7a7a" stroke-width=".15"></rect>
    </g>
  </g>

  <!-- inter-block arrows (centre line y=25) -->
  <path class="arrow-grey" d="M21.4,25 L24.4,25" marker-end="url(#arrGrey)"></path>
  <path class="arrow-grey" d="M45.4,25 L48.4,25" marker-end="url(#arrGrey)"></path>
  <path class="arrow" d="M69.4,25 L77.4,25" marker-end="url(#arr)"></path>

  <!-- ============================================================
       SYMBOLIC SPACE — SR block centred at y=36.
       ============================================================ -->

  <g transform="translate(78,16)">
    <rect class="box-sym" x="0" y="0" width="32" height="18" rx="1.2"></rect>
    <text class="lbl" x="16" y="7.3" text-anchor="middle" dominant-baseline="middle">symbolic</text>
    <text class="lbl" x="16" y="12.3" text-anchor="middle" dominant-baseline="middle">regression</text>
  </g>
  <text class="lbl-sm" x="94" y="13.8" text-anchor="middle" fill="#5a5a5a">candidate equation</text>

  <!-- ============================================================
       CONCEPT BOXES.
       structural concepts:  y=11–27 (centre 19), h=16
       behavioural concepts: y=39–55 (centre 47), h=16
       + calibration:        y=58–65 (centre 61.5), h=7
       ============================================================ -->

  <g transform="translate(130,8)">
    <rect class="box-struct" x="0" y="0" width="44" height="14" rx="1.2"></rect>
    <text class="lbl" x="22" y="7.5" text-anchor="middle" dominant-baseline="middle">structural concepts</text>
  </g>

  <g transform="translate(130,28)">
    <rect class="box-behav" x="0" y="0" width="44" height="14" rx="1.2"></rect>
    <text class="lbl" x="22" y="7.5" text-anchor="middle" dominant-baseline="middle">behavioural concepts</text>
  </g>

  <g transform="translate(140,43)">
    <rect class="box-calib" x="0" y="0" width="34" height="5" rx="1"></rect>
    <text class="lbl-cal" x="17" y="2.8" text-anchor="middle" dominant-baseline="middle">+ gating</text>
  </g>
  <path d="M157,42 L157,43" stroke="#8E7CA8" stroke-width=".5" fill="none"></path>

  <!-- SR fan-out arrows (only struct + behav) -->
  <path class="arrow-struct" d="M110,24 C118,24 122,19 130,15" marker-end="url(#arrStruct)"></path>
  <path class="arrow-behav" d="M110,26 C118,26 122,32 130,35" marker-end="url(#arrBehav)"></path>

  <!-- linear baseline → calibration -->
  <path class="arrow-grey" d="M59,34 C72,48 110,50 140,45.5" marker-end="url(#arrGrey)"></path>
  <text class="annot" x="90" y="42" text-anchor="middle" fill="#7a7a7a" font-style="italic">linear baseline</text>

  <!-- ============================================================
       CONCEPT VECTOR — 16 cells, 12 wide, 2.0 tall (h=32).
       9 structural + 6 behavioural + 1 gating.
       ============================================================ -->

  <g transform="translate(196,11)">
    <rect x="-.5" y="-.5" width="13" height="33" fill="#FFFFFF" stroke="#3a3a3a" stroke-width=".5"></rect>

    <g fill="#4F90C0">
      <rect x="0" y="0" width="12" height="2"></rect>
      <rect x="0" y="2" width="12" height="2"></rect>
      <rect x="0" y="4" width="12" height="2"></rect>
      <rect x="0" y="6" width="12" height="2"></rect>
      <rect x="0" y="8" width="12" height="2"></rect>
      <rect x="0" y="10" width="12" height="2"></rect>
      <rect x="0" y="12" width="12" height="2"></rect>
      <rect x="0" y="14" width="12" height="2"></rect>
      <rect x="0" y="16" width="12" height="2"></rect>
    </g>
    <g stroke="#FFFFFF" stroke-width=".3">
      <line x1="0" y1="2" x2="12" y2="2"></line>
      <line x1="0" y1="4" x2="12" y2="4"></line>
      <line x1="0" y1="6" x2="12" y2="6"></line>
      <line x1="0" y1="8" x2="12" y2="8"></line>
      <line x1="0" y1="10" x2="12" y2="10"></line>
      <line x1="0" y1="12" x2="12" y2="12"></line>
      <line x1="0" y1="14" x2="12" y2="14"></line>
      <line x1="0" y1="16" x2="12" y2="16"></line>
    </g>

    <g fill="#D88A55">
      <rect x="0" y="18" width="12" height="2"></rect>
      <rect x="0" y="20" width="12" height="2"></rect>
      <rect x="0" y="22" width="12" height="2"></rect>
      <rect x="0" y="24" width="12" height="2"></rect>
      <rect x="0" y="26" width="12" height="2"></rect>
      <rect x="0" y="28" width="12" height="2"></rect>
    </g>
    <g stroke="#FFFFFF" stroke-width=".3">
      <line x1="0" y1="20" x2="12" y2="20"></line>
      <line x1="0" y1="22" x2="12" y2="22"></line>
      <line x1="0" y1="24" x2="12" y2="24"></line>
      <line x1="0" y1="26" x2="12" y2="26"></line>
      <line x1="0" y1="28" x2="12" y2="28"></line>
    </g>

    <rect x="0" y="30" width="12" height="2" fill="#8E7CA8"></rect>

    <line x1="-.5" y1="18" x2="12.5" y2="18" stroke="#3a3a3a" stroke-width=".5"></line>
    <line x1="-.5" y1="30" x2="12.5" y2="30" stroke="#3a3a3a" stroke-width=".5"></line>
  </g>

  <!-- merge arrows -->
  <path class="arrow-struct" d="M174,15 C184,15 188,18 196,20" marker-end="url(#arrStruct)"></path>
  <path class="arrow-behav" d="M174,35 C184,35 189,35 196,35" marker-end="url(#arrBehav)"></path>
  <path class="arrow-calib" d="M174,45.5 C184,45.5 190,43 196,41" marker-end="url(#arrCalib)"></path>

  <text class="lbl-sm" x="202" y="49" text-anchor="middle" fill="#5a5a5a">concept vector</text>

</svg>